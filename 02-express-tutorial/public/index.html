<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example</title>
    <style>
        body{

            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #333;
            color: white;
            font-family: sans-serif;
           
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        
        h1{
            font-size: 70px;
            transition: .4s;
            cursor: pointer;
            display: block;
        }
        h1:hover{
            font-size: 80px;
        }
        h1:active{
            font-size: 68px;
        }
        
        p{
            margin: 20px;
        }
     
    </style>
</head>
<body>
    <div class="con">
        <h1 onclick="getData()">Click to see products</h1>
        
    </div>
    
    <script>
       let body = document.body
       let productsDiv = document.querySelector('.products')

        async function getData() {
            body.innerHTML = ''

            const url = "/api/v1/products";
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Response status: ${response.status}`);
                }

                const json = await response.json();
                console.log(json);

                

                for(let i = 0; i < json.length; i += 1){

                    let name = json[i].name
                    let id = json[i].id
                    let price = json[i].price
                    let desc = json[i].desc

                    body.innerHTML += 
                        `<p>
                            Id: ${id}<br>
                            Name: ${name}<br>
                            Price: ${price}<br>
                            Description: ${desc}<br>
                            
                        </p>`
                }

            } catch (error) {
                console.error(error.message);
            }

            
        }
        
    </script>
</body>
</html>
